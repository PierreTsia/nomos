name: Feature request
description: Suggest a component, a token or a capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The need
      description: What are you trying to do that Nomos does not cover?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see? Remember the core is app-agnostic (ADR 0002).
    validations:
      required: false
