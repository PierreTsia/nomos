name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck

      # The distributable package must build and stay self-sufficient: the build fails if
      # the JS keeps an internal alias or if a type does not resolve.
      - run: npm run build:package

      # Committed generated artifacts. CI fails if one has drifted from its source
      # (tokens, MCP view, view CSS, public surface).
      - run: npm run tokens:check
      - run: npm run view:check
      - run: npm run view-css:check
      - run: npm run surface:check

      # The package is installed in a fresh project and exercised as a consumer would:
      # import the core, start the MCP bin, read a view.
      - run: npm run smoke:consumer

  # The site is an ancillary (ADR 0028): a consumer of the package, built in its own job
  # so a site failure is never read as a core failure. It touches none of the core drift
  # gates and is not part of the published tarball.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
