name: Release

# Changesets drives the release: on `main`, the action opens (or updates) a
# "Version Packages" PR that consumes the changesets; when that PR is merged it
# publishes to npmjs.com. No hand-pushed tags — the version comes from the changesets.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance: the publish is signed via OIDC.
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint

      - uses: changesets/action@v1
        with:
          # `changeset publish` directly: running it through `npm run` prefixes the output
          # and muddles the action's parsing.
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The changesets action looks for NPM_TOKEN to choose token auth over OIDC;
          # NODE_AUTH_TOKEN is what the npm CLI reads.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # The action creates tags locally but does not push them: we push them ourselves, so
      # every published version has an immutable tag (ADR 0024).
      - name: Push the tags created by changesets
        run: git push --tags
