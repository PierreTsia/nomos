name: Release

# Changesets drives the release: on `main`, the action opens (or updates) a
# "Version Packages" PR that consumes the changesets; when that PR is merged it
# publishes to npmjs.com. No hand-pushed tags — the version comes from the changesets.
on:
  push:
    branches: [main]
  # Manual retry: a release is a push to main, but a suppressed/lost push event
  # (bot merge, Actions hiccup) leaves an unpublished version. This replays it.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Trusted publishing: the publish authenticates via OIDC, no npm token.
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm >= 11.5.1, the minimum for trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint

      # No NPM_TOKEN on purpose: with it absent, the action (and the npm CLI behind
      # `changeset publish`) authenticates via OIDC trusted publishing and signs
      # provenance automatically. The action also pushes the release tags itself.
      - uses: changesets/action@v2
        with:
          # `changeset publish` directly: running it through `npm run` prefixes the output
          # and muddles the action's parsing.
          publish-script: npx changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true
