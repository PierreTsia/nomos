version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # TypeScript 7 is blocked by the toolchain: the latest released typescript-eslint peers
    # `typescript <6.1.0`, so a major bump fails `npm ci`. Patch/minor on 6.x keep flowing.
    # Revisit when typescript-eslint supports TS 7 (issue #49).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
